<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지후 배틀 — 이사했어요</title>
<link rel="canonical" href="https://sebonalt3.github.io/JHBT/">
<meta http-equiv="refresh" content="5; url=https://sebonalt3.github.io/JHBT/">
<style>
:root { --bg:#f4f4f1; --card:#fff; --ink:#151515; --sub:#666; --line:#151515; }
@media (prefers-color-scheme: dark) { :root { --bg:#141414; --card:#1e1e1e; --ink:#f2f2f2; --sub:#aaa; --line:#f2f2f2; } }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
  background:var(--bg); color:var(--ink); font-family:system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
.card { width:100%; max-width:420px; background:var(--card); border:2px solid var(--line); border-radius:14px;
  padding:32px 24px; text-align:center; box-shadow:6px 6px 0 var(--line); }
h1 { margin:0 0 8px; font-size:26px; }
p { margin:0 0 20px; color:var(--sub); line-height:1.6; }
a.go { display:block; padding:14px; border:2px solid var(--line); border-radius:10px; background:var(--ink); color:var(--card);
  font-weight:700; font-size:17px; text-decoration:none; }
.url { margin-top:14px; font-size:13px; color:var(--sub); word-break:break-all; }
</style>
</head>
<body>
<main class="card">
  <h1>🚚 지후 배틀이 이사했어요</h1>
  <p>새 주소에서 계속 플레이할 수 있어요.<br>저장된 기록과 로그인은 그대로 이어집니다.<br><span id="count">5</span>초 뒤 자동으로 이동합니다.</p>
  <a class="go" id="go" href="https://sebonalt3.github.io/JHBT/">새 주소로 가기</a>
  <div class="url">sebonalt3.github.io/JHBT</div>
</main>
<script>
(function () {
  var target = 'https://sebonalt3.github.io/JHBT/' + location.search + location.hash;
  document.getElementById('go').href = target;
  var n = 5, el = document.getElementById('count');
  var t = setInterval(function () {
    n -= 1; el.textContent = n;
    if (n <= 0) { clearInterval(t); location.replace(target); }
  }, 1000);
})();
</script>
</body>
</html>
